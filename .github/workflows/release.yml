# Native apps, triggered by a version tag such as v1.0.0 (or by hand from the Actions tab, which
# builds the files without releasing them). Produces a DRAFT GitHub release with:
#   MurphyInbox-Setup-<v>-windows-x64.exe   Electron app (desktop/), NSIS installer
#   MurphyInbox-<v>-macos-universal.dmg     Electron app (desktop/), Apple silicon + Intel
#   MurphyInbox-<v>-android.apk             Trusted Web Activity (android/)
#   SHA256SUMS.txt
#
# All three load https://mail.murphylabs.org, so web app updates reach them without a new release.
#
# Signing:
#   Android (required for a full-screen app): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS. The key's fingerprint must match src/web/public/.well-known/assetlinks.json.
#   macOS (optional): CSC_LINK (base64 Developer ID .p12), CSC_KEY_PASSWORD, APPLE_ID,
#     APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. Without them the app is ad-hoc signed and not
#     notarized: first launch needs right-click > Open (or System Settings > Privacy > Open Anyway).
#   Windows (optional): WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD. Without them SmartScreen warns once.
name: Release apps

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.$GITHUB_RUN_NUMBER; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not X.Y.Z"; exit 1
          fi
          IFS=. read -r major minor patch <<EOF
          $version
          EOF
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Android versionCode must grow with every release.
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [ -n "$CSC_LINK" ] || { unset CSC_LINK CSC_KEY_PASSWORD; echo "::notice title=Windows signing::WIN_CSC_LINK is not set; the installer is unsigned."; }
          npm ci --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: desktop/dist/MurphyInbox-Setup-*.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build disk image
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            npm run dist:mac -- -c.mac.notarize=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "::notice title=macOS signing::Apple secrets are not set; the app is ad-hoc signed and not notarized."
            # "-" is an ad-hoc signature: Apple silicon refuses to run unsigned code at all.
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi
      - name: Check the app
        run: |
          hdiutil attach "desktop/dist/MurphyInbox-$VERSION-macos-universal.dmg" -mountpoint /Volumes/mi -nobrowse
          lipo -archs "/Volumes/mi/MurphyInbox.app/Contents/MacOS/MurphyInbox"
          codesign --verify --deep --strict --verbose=2 "/Volumes/mi/MurphyInbox.app"
          hdiutil detach /Volumes/mi
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: desktop/dist/MurphyInbox-*-macos-universal.dmg
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning title=Android signing::ANDROID_KEYSTORE_B64 is not set; the APK is debug-signed and shows a browser bar."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle -p android --no-daemon assembleRelease
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/MurphyInbox-$VERSION_NAME-android.apk"
      - name: Check the signature matches assetlinks.json
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "out/MurphyInbox-$VERSION_NAME-android.apk" | tee "$RUNNER_TEMP/certs.txt"
          got=$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
          want=$(python3 -c "import json;print(json.load(open('src/web/public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")
          echo "apk:        $got"; echo "assetlinks: $want"
          [ "$got" = "$want" ] || { echo "::error::the APK's signing key is not the one in assetlinks.json"; exit 1; }
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: out/*.apk
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          for f in "MurphyInbox-Setup-$VERSION-windows-x64.exe" "MurphyInbox-$VERSION-macos-universal.dmg" "MurphyInbox-$VERSION-android.apk"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          MurphyInbox apps for Windows, macOS and Android. Each one opens https://mail.murphylabs.org, so
          updates to the web app arrive without reinstalling.

          - **Windows:** run the installer. If SmartScreen warns, choose More info, then Run anyway.
          - **macOS:** open the disk image and drag MurphyInbox to Applications. The first time, right-click
            the app and choose Open (or System Settings > Privacy & Security > Open Anyway).
          - **Android:** open the APK on the phone and allow installing from that source. Chrome must be
            installed. Notifications: Settings > Account > Notifications on this device.
          - **iPhone and iPad:** no app file; in Safari, tap Share > Add to Home Screen.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "MurphyInbox apps $VERSION" --notes-file notes.md assets/*
